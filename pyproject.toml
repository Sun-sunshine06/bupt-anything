[project]
name = "bupt-agent"
version = "0.1.0"
description = "Local BUPT campus tools for AI agents"
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.20,<2",
  "keyring>=25,<27",
  "platformdirs>=4,<5",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=6,<7",
  "tzdata>=2025.2",
]

[project.scripts]
bupt-agent = "bupt_agent.cli:main"
bupt-agent-mcp = "bupt_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bupt_agent"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/bupt_agent", "tests", "scripts", "docs", ".github",
  "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md",
  "pyproject.toml", "uv.lock", ".python-version", ".gitignore", ".gitattributes",
  "configure-account.cmd", "mcp.example.json",
  "mkdocs.yml", "site_overrides",
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.har", "**/*.log"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
